server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /srv/virtual-soundforge;
    index index.html;

    # The base nginx.conf includes /etc/nginx/mime.types for CSS and ES modules.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        return 404;
    }
}
